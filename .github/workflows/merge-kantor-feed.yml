name: Merge Kantor feed into the UI audit

on:
  push:
    branches:
      - cursor/kantor-ui-audit-c85c
    paths:
      - .github/workflows/merge-kantor-feed.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge main, keep the audit, rebuild the bundle
        run: |
          set -euo pipefail
          if [ ! -f kantor/.feed-merge.patch ]; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "Indra Harmoyo"
          git config user.email "indra@jerconetwork.com"
          git apply --check kantor/.feed-merge.patch
          git apply kantor/.feed-merge.patch
          git add kantor/src/app.js
          git commit -m "Keep the live Kantor feed inside the UI audit."
          git fetch origin main
          git merge origin/main -X ours --no-edit
          npm install --no-audit --no-fund
          npm run build:kantor
          node --check kantor/app.js
          grep -q "Lantai hidup" kantor/app.js
          grep -q "feed.json" kantor/app.js
          git checkout -- package-lock.json
          rm -f kantor/.feed-merge.patch .github/workflows/merge-kantor-feed.yml
          git add -A
          git status --short
          git commit -m "Rebuild the Kantor bundle with the audit and the live feed."
          git push origin HEAD:cursor/kantor-ui-audit-c85c
