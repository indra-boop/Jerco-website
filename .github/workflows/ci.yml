name: Static website CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Service contract (kept outside published webroot)
        run: python .github/scripts/validate_service_contract.py --manifest deploy/SERVICE.json
      - name: Check committed JavaScript syntax
        run: find js kantor -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Validate JSON inputs
        run: |
          python - <<'PY'
          import json, pathlib
          for folder in ['data', 'deploy']:
              for p in pathlib.Path(folder).rglob('*.json'):
                  json.loads(p.read_text(encoding='utf-8'))
          print('JSON inputs parsed')
          PY
