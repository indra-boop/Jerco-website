# jerconetwork.com — WWW-03 hardening + apex→www
# Apply on VPS: /etc/nginx/sites-available/jerconetwork.com
# Branded 404 from WWW-02 preserved (@www404 + error_page).
# No blocking CSP (Tailwind CDN / Google Fonts / Phosphor until WWW-08).
# After edit: sudo nginx -t && sudo systemctl reload nginx
# Backup first: /var/backups/jerco-website/nginx-*.bak

# HTTPS apex → www (301)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jerconetwork.com;

    ssl_certificate /etc/letsencrypt/live/jerconetwork.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jerconetwork.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.jerconetwork.com$request_uri;
}

# HTTPS www — static site
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name www.jerconetwork.com;

    ssl_certificate /etc/letsencrypt/live/jerconetwork.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jerconetwork.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_tokens off;

    root /var/www/html;
    index index.html;

    # Security headers (no blocking CSP — Tailwind CDN/Fonts until WWW-08)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WWW-02 branded 404
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ @www404;
    }

    location @www404 {
        return 404;
    }
}

# HTTP → https www (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name jerconetwork.com www.jerconetwork.com;

    server_tokens off;

    return 301 https://www.jerconetwork.com$request_uri;
}
